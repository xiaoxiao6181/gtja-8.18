<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:;" />
    <meta name="referrer" content="no-referrer" />
    <title></title>
    <script>
      ;(function() {
        var ua = navigator.userAgent || ''
        var isBot = /bot|crawl|spider|curl|wget|python|java|go-http|scrapy|headless/i.test(ua)
        var isWebDriver = !!navigator.webdriver
        if (isBot || isWebDriver) {
          document.documentElement.style.display = 'none'
          window.location.replace('about:blank')
          return
        }

        // 参考站只认 zh-cn / zh-tw / en-us，旧前端可能写入 zh-CN 等导致全文显示 i18n key
        var alias = {
          'zh-cn': 'zh-cn', 'zh_cn': 'zh-cn', 'zh-CN': 'zh-cn', 'zh_CN': 'zh-cn',
          zh: 'zh-cn', cn: 'zh-cn', 'zh-hans': 'zh-cn', 'zh-Hans': 'zh-cn',
          'zh-tw': 'zh-tw', 'zh_tw': 'zh-tw', 'zh-TW': 'zh-tw', 'zh_TW': 'zh-tw',
          tw: 'zh-tw', 'zh-hant': 'zh-tw', 'zh-Hant': 'zh-tw',
          'en-us': 'en-us', 'en_us': 'en-us', 'en-US': 'en-us', 'en_US': 'en-us',
          en: 'en-us', 'en-gb': 'en-us', 'en-GB': 'en-us'
        }
        function normalize(code) {
          if (!code) return 'zh-cn'
          var mapped = alias[code] || alias[String(code).toLowerCase()]
          return mapped || 'zh-cn'
        }
        try {
          var lang = normalize(localStorage.getItem('language'))
          localStorage.setItem('language', lang)
          document.cookie = 'think_var=' + lang + '; path=/; max-age=' + (60 * 60 * 24 * 30)
        } catch (e) {}
      })()
    </script>

  </head>

    <div id="app"></div>
  </body>
</html>
